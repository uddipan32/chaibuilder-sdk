name: Lint and Test

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  # Commit subjects become the chaicore changelog. The .husky/commit-msg hook is the fast
  # feedback; this job is the backstop that cannot be skipped with --no-verify. Note it
  # only sees pull requests — commits pushed straight to dev/main are covered by the hook.
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Validate commit messages
        run: |
          bunx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install dependencies
        run: bun install

      # .env.test is gitignored — recreate for dotenv loaders in vitest / drizzle
      - name: Write .env.test
        run: |
          printf '%s\n' \
            'TEST_DATABASE_URL=file:./.tmp/chaibuilder_test.sqlite' \
            > .env.test

      - name: Run ESLint on entire project
        run: bun run lint

      - name: Run unit tests
        run: bunx vitest run --passWithNoTests

      - name: Generate sqlite migrations
        run: bun run db:test:generate

      - name: Run integration tests
        env:
          NODE_ENV: test
        run: bun run test:integration
